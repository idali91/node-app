apiVersion: apps/v1
kind: Deployment
metadata:
  name: tecnico-node
  labels:
    app.kubernetes.io/name: tecnico-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tecnico-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tecnico-node
    spec:
      imagePullSecrets:
        - name: dockerhub-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: __IMAGE_NAME__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tecnico-node
  labels:
    app.kubernetes.io/name: tecnico-node
spec:
  selector:
    app.kubernetes.io/name: tecnico-node
  ports:
    - name: http
      port: 80
      targetPort: http
